[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uktl"
version = "0.2.0"
description = "PyTorch implementation of UKTL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["uktl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
